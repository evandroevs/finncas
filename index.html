<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1e1e24" />
<title>Painel — Contas e Atividades</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<script>
  // Antes de qualquer pintura: sem escolha salva, segue o sistema.
  (() => {
    const salvo = localStorage.getItem("painel.tema");
    const escuro = salvo ? salvo === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
  })();
</script>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>

<header>
  <div class="wrap topbar">
    <div class="brand"><span class="dot"></span><span>Painel</span></div>
    <div class="cabeca-dir">
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="contas" aria-selected="true">Contas</button>
        <button role="tab" data-tab="quadros" aria-selected="false">Atividades</button>
        <button role="tab" data-tab="metas" aria-selected="false">Metas</button>
      </nav>
      <button id="btnTema" aria-label="Alternar tema"></button>
    </div>
  </div>
</header>

<!-- ══════════════════ ABA CONTAS ══════════════════ -->
<section id="tab-contas" role="tabpanel">
  <div class="wrap">
    <div class="monthnav">
      <button class="arrow" id="prev" title="Mês anterior" aria-label="Mês anterior">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="mesLabel" title="Escolher mês"></button>
      <input type="month" id="mesPicker" tabindex="-1" aria-hidden="true" />
      <button class="arrow" id="next" title="Próximo mês" aria-label="Próximo mês">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <section class="resumo">
      <div class="stats">
        <div class="stat"><div class="label">Total</div><div class="val" id="stTotal">R$ 0,00</div></div>
        <div class="stat pago"><div class="label">Pago</div><div class="val" id="stPago">R$ 0,00</div></div>
        <div class="stat falta"><div class="label">Falta</div><div class="val" id="stFalta">R$ 0,00</div></div>
      </div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
      <div class="barinfo"><span id="barTxt">0 de 0 contas pagas</span><span id="barPct">0%</span></div>
    </section>

    <form class="add" id="formAdd" autocomplete="off">
      <div class="g-nome"><input type="text" id="fNome" placeholder="Nome da conta (ex: Aluguel)" required /></div>
      <div class="g-valor"><input type="text" id="fValor" inputmode="decimal" placeholder="R$ 0,00" /></div>
      <div class="g-dia"><input type="number" id="fDia" min="1" max="31" placeholder="Dia" /></div>
      <div class="g-desc"><input type="text" id="fDesc" placeholder="Descrição (opcional)" /></div>
      <div class="g-rep"><select id="fRepete" aria-label="Repetição"></select></div>
      <div class="g-btn"><button class="btn" type="submit">Adicionar</button></div>
    </form>

    <ul class="lista" id="lista"></ul>

    <div class="rodape">
      <button class="btn ghost" id="btnCopiar">Copiar contas do mês anterior</button>
      <button class="btn ghost" data-backup="exportar">Exportar backup</button>
      <button class="btn ghost" data-backup="importar">Importar backup</button>
    </div>
    <p class="aviso">Os dados ficam salvos neste navegador. Use “Exportar backup” de vez em quando.</p>
  </div>
</section>

<!-- ══════════════════ ABA ATIVIDADES ══════════════════ -->
<section id="tab-quadros" role="tabpanel" class="oculto">
  <div class="quadro-bar">
    <select class="sel-quadro" id="selQuadro" aria-label="Quadro"></select>
    <button class="btn sm" id="btnNovoQuadro" title="Novo quadro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="rotulo">Novo quadro</span>
    </button>
    <button class="btn ghost sm" id="btnRenomearQuadro" title="Renomear quadro" aria-label="Renomear quadro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span class="rotulo">Renomear</span>
    </button>
    <button class="btn ghost sm" id="btnExcluirQuadro" title="Excluir quadro" aria-label="Excluir quadro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span class="rotulo">Excluir</span>
    </button>
    <span class="quadro-prog" id="quadroProg"></span>
    <span class="espaco"></span>
    <input type="text" class="busca" id="buscaCard" placeholder="Buscar card…" />
    <button class="btn ghost sm" data-backup="exportar">Exportar backup</button>
  </div>
  <div class="board" id="board"></div>
</section>

<!-- ══════════════════ ABA METAS ══════════════════ -->
<section id="tab-metas" role="tabpanel" class="oculto">
  <div class="metas-bar">
    <select class="sel-area" id="selArea" aria-label="Área da vida"></select>
    <button class="btn sm" id="btnNovaMeta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="rotulo">Nova meta</span>
    </button>
    <span class="espaco"></span>
    <button class="btn ghost sm" data-backup="exportar"><span class="rotulo">Exportar backup</span></button>
  </div>

  <div class="revisao-aviso" id="revisaoAviso"></div>
  <div class="metas-resumo" id="metasResumo"></div>
  <div class="mapa" id="mapa"></div>
</section>

<!-- Modal de meta -->
<dialog id="modalMeta">
  <div class="modal-head">
    <input type="text" id="gTitulo" placeholder="O que você quer alcançar" />
    <button type="button" class="icon" id="gFechar" title="Fechar" aria-label="Fechar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="campo">
      <label for="gDetalhe">Por que essa meta importa</label>
      <textarea id="gDetalhe" placeholder="O que muda na sua vida quando ela for cumprida. Isso é o que segura o plano nos meses difíceis."></textarea>
    </div>
    <div class="linha-3">
      <div class="campo"><label for="gHorizonte">Horizonte</label><select id="gHorizonte"></select></div>
      <div class="campo"><label for="gArea">Área da vida</label><select id="gArea"></select></div>
      <div class="campo"><label for="gPrazo">Prazo</label><input type="month" id="gPrazo" /></div>
    </div>
    <div class="campo">
      <label for="gPai">Puxa de qual meta maior</label>
      <select id="gPai"></select>
    </div>
    <div class="campo">
      <label for="gTipoMedida">Como medir</label>
      <select id="gTipoMedida">
        <option value="numero">Número (de X até Y)</option>
        <option value="marcos">Marcos (lista de etapas)</option>
        <option value="simples">Sem número — só acompanhar</option>
      </select>
    </div>
    <div class="linha-3" id="blocoNumero">
      <div class="campo"><label for="gInicio">Ponto de partida</label><input type="text" id="gInicio" inputmode="decimal" placeholder="0" /></div>
      <div class="campo"><label for="gAlvo">Alvo</label><input type="text" id="gAlvo" inputmode="decimal" placeholder="100" /></div>
      <div class="campo"><label for="gUnidade">Unidade</label><input type="text" id="gUnidade" placeholder="R$, kg, clientes…" /></div>
    </div>
    <div class="campo" id="blocoMarcos">
      <label>Marcos <span id="gMarcosResumo" style="text-transform:none;letter-spacing:0"></span></label>
      <div class="chk-barra" id="gMarcosBarra"><i style="width:0%"></i></div>
      <ul class="chk-lista" id="gMarcosLista"></ul>
      <div class="chk-add">
        <input type="text" id="gMarcoNovo" placeholder="Adicionar marco…" />
        <button type="button" class="btn sm" id="gMarcoAdd">Adicionar</button>
      </div>
    </div>
    <div class="campo">
      <label>Como está</label>
      <div class="rev-status" id="gStatus"></div>
    </div>
    <div class="campo" id="blocoFilhos">
      <label>Metas que puxam desta</label>
      <div class="filhos-lista" id="gFilhos"></div>
    </div>
    <div class="campo" id="blocoHistorico">
      <label>Histórico das revisões</label>
      <div class="linha-tempo" id="gHistorico"></div>
    </div>
  </div>
  <div class="modal-pe">
    <button type="button" class="btn perigo sm" id="gExcluir">Excluir meta</button>
    <span class="espaco"></span>
    <button type="button" class="btn ghost sm" id="gCancelar">Cancelar</button>
    <button type="button" class="btn sm" id="gSalvar">Salvar</button>
  </div>
</dialog>

<!-- Modal da revisão mensal -->
<dialog id="modalRevisao" class="largo">
  <div class="modal-head">
    <div style="flex:1">
      <div style="font-weight:700;font-size:16px" id="rTitulo">Revisão do mês</div>
      <div style="font-size:12.5px;color:var(--txt-3)" id="rSub"></div>
    </div>
    <button type="button" class="icon" id="rFechar" title="Fechar" aria-label="Fechar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="modal-body" id="rCorpo"></div>
  <div class="modal-pe">
    <button type="button" class="btn perigo sm" id="rExcluir">Excluir revisão</button>
    <span class="espaco"></span>
    <button type="button" class="btn ghost sm" id="rCancelar">Fechar</button>
    <button type="button" class="btn sm" id="rSalvar">Salvar revisão</button>
  </div>
</dialog>

<!-- Modal de card -->
<dialog id="modalCard">
  <form method="dialog" id="formCard">
    <div class="modal-head">
      <button type="button" class="kcheck" id="mFeito" title="Concluída" aria-label="Marcar como concluída">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
      <input type="text" id="mTitulo" placeholder="Título da atividade" />
      <button type="button" class="icon" id="mFechar" title="Fechar" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="campo">
        <label for="mDesc">Descrição</label>
        <textarea id="mDesc" placeholder="Detalhes, links, o que precisa ser feito…"></textarea>
      </div>
      <div class="campo-linha tres">
        <div class="campo"><label for="mData">Dia</label><input type="date" id="mData" /></div>
        <div class="campo"><label for="mHora">Hora</label><input type="time" id="mHora" /></div>
        <div class="campo"><label for="mDuracao">Duração</label><select id="mDuracao"></select></div>
      </div>
      <div class="campo-linha">
        <div class="campo"><label for="mLembrete">Lembrete</label><select id="mLembrete"></select></div>
        <div class="campo"><label for="mColuna">Coluna</label><select id="mColuna"></select></div>
      </div>
      <div class="campo">
        <label>Checklist <span id="mChkResumo" style="text-transform:none;letter-spacing:0"></span></label>
        <div class="chk-barra" id="mChkBarra"><i style="width:0%"></i></div>
        <ul class="chk-lista" id="mChkLista"></ul>
        <div class="chk-add">
          <input type="text" id="mChkNovo" placeholder="Adicionar item…" />
          <button type="button" class="btn sm" id="mChkAdd">Adicionar</button>
        </div>
      </div>
    </div>
    <div class="modal-pe">
      <button type="button" class="btn perigo sm" id="mExcluir">Excluir card</button>
      <button type="button" class="btn ghost sm" id="mGoogle" title="Abrir no Google Agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="rotulo">Google Agenda</span>
      </button>
      <span class="espaco"></span>
      <button type="button" class="btn ghost sm" id="mCancelar">Cancelar</button>
      <button type="button" class="btn sm" id="mSalvar">Salvar</button>
    </div>
  </form>
</dialog>

<input type="file" id="fileImport" accept="application/json" style="display:none" />
<div id="toast"></div>

<script src="assets/base.js"></script>
<script src="assets/contas.js"></script>
<script src="assets/quadros.js"></script>
<script src="assets/metas.js"></script>
</body>
</html>
